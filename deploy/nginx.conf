map $http_x_forwarded_proto $django_proto {
    default $scheme;
    https https;
}

upstream django_upstream {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 55m;

    # Статика (collectstatic → /app/staticfiles в контейнере nginx)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Старые видео остаются в резервной копии, но больше не публикуются.
    location ^~ /media/service_videos/ {
        return 404;
    }
    location ^~ /media/service_examples/videos/ {
        return 404;
    }

    # Медиа (общий том с контейнером web)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $django_proto;
        proxy_set_header Connection "";
    }
}
