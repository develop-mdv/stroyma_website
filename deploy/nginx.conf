map $http_x_forwarded_proto $django_proto {
    default $scheme;
    https https;
}

upstream django_upstream {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    error_page 502 503 504 /50x.html;

    location = /50x.html {
        internal;
        alias /etc/nginx/50x.html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    client_max_body_size 55m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # HTML виджета всегда проверяется при открытии; модули под ним имеют версии
    # в URL и могут оставаться в долгом кеше. Ограничиваем источники и встраивание.
    location = /static/color_configurator/index.html {
        alias /app/staticfiles/color_configurator/index.html;
        gzip on;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; frame-ancestors 'self'" always;
    }

    # Статика (collectstatic → /app/staticfiles в контейнере nginx)
    location /static/ {
        alias /app/staticfiles/;
        gzip on;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Старые видео остаются в резервной копии, но больше не публикуются.
    location ^~ /media/service_videos/ {
        return 404;
    }
    location ^~ /media/service_examples/videos/ {
        return 404;
    }

    # Только публичные изображения из известных каталогов. Остальные файлы не отдаём.
    location ~* ^/media/(?:base_textures|category_images|products|service_examples|service_photos|services)/.+\.(?:jpe?g|png|webp|gif)$ {
        root /app;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Stroyma-Client-IP $http_x_stroyma_client_ip;
        proxy_set_header X-Forwarded-Proto $django_proto;
        proxy_set_header Connection "";
    }
}
