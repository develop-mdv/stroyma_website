services:
  web:
    environment:
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "True"
      TRUST_PROXY_CLIENT_IP: "True"

  worker:
    build: .
    env_file: .env
    environment:
      DEBUG: "False"
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    command:
      - sh
      - -c
      - until python manage.py migrate --check >/dev/null 2>&1; do sleep 5; done; exec python manage.py process_order_notifications --loop
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_URL: ${SITE_URL:?Set SITE_URL to https://your-domain.ru in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
