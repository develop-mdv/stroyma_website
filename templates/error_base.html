<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>{% block title %}Ошибка — СТРОЙМА{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8f5ef; color: #1b2922; font-family: system-ui, sans-serif; }
        main { width: min(100%, 620px); padding: clamp(28px, 7vw, 64px); background: #fff; border: 1px solid #e5e9e5; border-radius: 24px; box-shadow: 0 18px 50px #17372812; }
        .brand { color: #1a5038; font-weight: 800; letter-spacing: .12em; text-decoration: none; }
        .code { margin: 48px 0 12px; color: #1a5038; font-size: clamp(64px, 15vw, 112px); font-weight: 800; line-height: 1; }
        h1 { margin: 0 0 16px; font-size: clamp(24px, 5vw, 36px); }
        p { color: #56645b; line-height: 1.6; }
        nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
        nav a { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 11px 18px; border-radius: 8px; background: #1a5038; color: #fff; font-weight: 650; text-decoration: none; }
        nav a + a { background: #edf3ee; color: #1a5038; }
        nav a:focus-visible { outline: 3px solid #d4a641; outline-offset: 3px; }
    </style>
</head>
<body>
<main>
    <a class="brand" href="/">СТРОЙМА</a>
    <div class="code" aria-hidden="true">{% block code %}{% endblock %}</div>
    <h1>{% block heading %}{% endblock %}</h1>
    <p>{% block message %}{% endblock %}</p>
    <nav aria-label="Навигация"><a href="/">На главную</a><a href="/catalog/">В каталог</a></nav>
</main>
</body>
</html>
