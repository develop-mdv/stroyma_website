services:
  web:
    environment:
      DEBUG: "True"
      SITE_URL: http://127.0.0.1:${HTTP_PORT:-8080}
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:${HTTP_PORT:-8080},http://127.0.0.1:${HTTP_PORT:-8080}
      ALLOW_ROBOTS_INDEXING: "False"

  nginx:
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
